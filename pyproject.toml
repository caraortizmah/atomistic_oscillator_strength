[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qm_etdac_calculator"
dynamic = ["version"]
description = "X-ray Absorption Spectroscopy (XAS) program that calculates excited-state charge transfer as a core-electron transition decomposition analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    {name = "Carlos A. Ortiz-Mahecha", email = "ortizmahecha@proton.me"},
]
keywords = [
    "quantum-chemistry",
    "xas",
    "x-ray",
    "spectroscopy",
    "excited-state",
    "charge-transfer",
    "molecular-orbitals",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "h5py>=3.10",
]

[project.urls]
Homepage = "https://github.com/caraortizmah/atomistic_oscillator_strength"
Repository = "https://github.com/caraortizmah/atomistic_oscillator_strength.git"
Documentation = "https://github.com/caraortizmah/atomistic_oscillator_strength/blob/main/docs"
Issues = "https://github.com/caraortizmah/atomistic_oscillator_strength/issues"

[project.optional-dependencies]
dev = [
    "pip-tools>=7.4",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
qm-etdac = "qm_etdac_calculator.cli:run_qm_etdac_calculator"
qm-etdac-test = "qm_etdac_calculator.cli:run_qm_etdac_test"

[tool.setuptools]
packages = ["qm_etdac_calculator"]

[tool.setuptools.dynamic]
version = {attr = "qm_etdac_calculator.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v"

[tool.coverage.run]
source = ["qm_etdac_calculator"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
